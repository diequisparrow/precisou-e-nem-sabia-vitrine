name: Storefront Sync

on:
  workflow_dispatch:

  schedule:
    # A cada 4 horas. Cron do GitHub Actions usa UTC.
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: storefront-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh Mercado Livre token
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python scripts/refresh_ml_token_ci.py

      - name: Sync storefront
        run: python scripts/sync_products.py

      - name: Detect storefront changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- public/products.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração em public/products.json."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "public/products.json foi alterado."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/products.json
          git commit -m "Sync storefront products"
          git push
